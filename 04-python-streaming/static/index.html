<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastAPI Streaming Demo</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b35; --fg:#e6e8ee; --dim:#8b93a3;
    --accent:#4f8cff; --ok:#3ddc97; --warn:#ffb454; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:22px 28px 10px}
  h1{margin:0 0 4px;font-size:19px;letter-spacing:.2px}
  header p{margin:0;color:var(--dim);font-size:13px}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 28px 28px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:340px}
  .panel h2{margin:0;padding:12px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .panel h2 span{color:var(--dim);font-weight:400;font-size:12px}
  .out{padding:14px 16px;flex:1;white-space:pre-wrap;word-break:break-word;font-size:14px;min-height:220px}
  .out .cursor{display:inline-block;width:7px;height:16px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .meta{padding:10px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
  .meta b{color:var(--fg);font-weight:500}
  .bar{padding:0 28px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:240px;background:#0b0d12;border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:8px;font:inherit}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);border:0;color:#fff;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed;filter:none}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .tag.live{color:var(--ok);border-color:#24604a}
  .tag.err{color:var(--warn);border-color:#5c4a24}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Streaming API demo · FastAPI + SSE</h1>
  <p>左：token 级流式（首字节即返回） · 右：缓冲式（生成完毕才返回）。同一段文本，看 TTFT 差异。</p>
</header>

<div class="bar">
  <input id="prompt" type="text" value="用一句话解释什么是流式接口" aria-label="prompt">
  <button id="run">开始对比</button>
  <button id="stop" class="ghost" disabled>中断流式</button>
  <span class="tag" id="state">idle</span>
</div>

<div class="wrap">
  <section class="panel">
    <h2>POST /api/chat/stream <span id="s-status">SSE</span></h2>
    <div class="out" id="s-out"></div>
    <div class="meta">
      <div>TTFB <b id="s-ttfb">–</b></div>
      <div>总耗时 <b id="s-total">–</b></div>
      <div>tokens <b id="s-tok">0</b></div>
      <div>事件 <b id="s-ev">0</b></div>
    </div>
  </section>

  <section class="panel">
    <h2>POST /api/chat <span>buffered JSON</span></h2>
    <div class="out" id="b-out"></div>
    <div class="meta">
      <div>TTFB <b id="b-ttfb">–</b></div>
      <div>总耗时 <b id="b-total">–</b></div>
      <div>tokens <b id="b-tok">0</b></div>
      <div>事件 <b>1</b></div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
let controller = null;

const setState = (t, cls='') => { const e=$('state'); e.textContent=t; e.className='tag '+cls; };

/** Minimal SSE parser over a fetch ReadableStream (EventSource can't POST). */
async function streamChat(prompt, signal, onEvent) {
  const res = await fetch('/api/chat/stream', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({prompt, token_delay_ms:30, max_tokens:120}),
    signal
  });
  if (!res.ok) throw new Error('HTTP '+res.status);
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    // SSE frames are separated by a blank line
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
      let event='message', data='';
      for (const line of frame.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
        // lines starting with ':' are heartbeats — ignore
      }
      if (data) { try { onEvent(event, JSON.parse(data)); } catch(e){} }
    }
  }
}

async function run() {
  $('run').disabled = true; $('stop').disabled = false;
  ['s-out','b-out'].forEach(id=>$(id).textContent='');
  ['s-ttfb','s-total','b-ttfb','b-total'].forEach(id=>$(id).textContent='–');
  $('s-tok').textContent='0'; $('b-tok').textContent='0'; $('s-ev').textContent='0';
  $('s-status').textContent='SSE'; $('s-status').className='';
  const prompt = $('prompt').value;
  const t0 = performance.now();
  let firstByte = null, tokens = 0, events = 0;

  // --- streaming, started first so both run concurrently ---
  controller = new AbortController();
  const cur = document.createElement('span');
  cur.className = 'cursor';
  $('s-out').appendChild(cur);
  setState('streaming','live');

  const streamPromise = streamChat(prompt, controller.signal, (ev, d) => {
    events++; $('s-ev').textContent = events;
    if (firstByte === null && ev === 'start') {
      firstByte = performance.now() - t0;
      $('s-ttfb').textContent = firstByte.toFixed(0) + ' ms';
    }
    if (ev === 'token') {
      cur.insertAdjacentText('beforebegin', d.text);
      tokens++; $('s-tok').textContent = tokens;
    }
    if (ev === 'error') { $('s-status').textContent = 'upstream error'; $('s-status').className=''; }
    if (ev === 'done') {
      cur.remove();
      $('s-total').textContent = (performance.now()-t0).toFixed(0)+' ms';
      setState(d.cancelled ? 'cancelled' : 'stream done', d.cancelled ? 'err' : 'live');
    }
  }).catch(e => {
    if (e.name === 'AbortError') { cur.remove(); setState('aborted','err'); }
    else { cur.remove(); $('s-status').textContent='error'; setState('error','err'); }
  }).finally(() => { $('stop').disabled = true; });

  // --- buffered, same payload ---
  const bt0 = performance.now();
  fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({prompt, token_delay_ms:30, max_tokens:120})
  }).then(r=>r.json()).then(d=>{
    const total = performance.now() - bt0;
    $('b-out').textContent = d.text;
    $('b-ttfb').textContent = total.toFixed(0)+' ms';   // first byte == last byte here
    $('b-total').textContent = total.toFixed(0)+' ms';
    $('b-tok').textContent = d.tokens;
  }).catch(()=>{ $('b-out').textContent='请求失败'; });

  await Promise.all([streamPromise]);
  $('run').disabled = false;
}

$('run').addEventListener('click', run);
$('stop').addEventListener('click', () => controller && controller.abort());
</script>
</body>
</html>
